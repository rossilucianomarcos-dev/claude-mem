name: Deploy Install Scripts

on:
  push:
    branches: [main]
    paths:
      - 'openclaw/install.sh'
      - 'install/**'
  workflow_dispatch:

# Deny by default; each job opts into exactly the scopes it needs.
permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout; the Vercel deploy authenticates with VERCEL_TOKEN
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Copy install scripts to deploy directory
        run: |
          mkdir -p install/public
          cp openclaw/install.sh install/public/openclaw.sh

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@16e87c0a08142b0d0d33b76aeaf20823c381b9b9 # v25.2.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ./install
